  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="余白">
  <link rel="apple-touch-icon" sizes="152x152" type="image/png" href="icons/apple-touch-icon-v2-152.png">

  <!-- Favicon -->

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFCF7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#191622">

  <title>余白 · Yubai</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="startup.css?v=20261025">

  <meta name="title" content="余白 · Yubai" />
  <meta name="description" content="Private local bookkeeping · Based on Cashew · GPL-3.0" />

  <meta property="og:title" content="余白 · Yubai" />
  <meta property="og:description" content="Private local bookkeeping · Based on Cashew · GPL-3.0" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="余白 · Yubai" />

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = {{flutter_service_worker_version}};
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

<body oncontextmenu="return false;">
  <script defer src="sql-wasm.js"></script>
  <div id="loading" aria-label="余白启动中">
    <main class="launch-main">
      <div class="launch-mark" aria-hidden="true">
        <img class="launch-logo" src="startup/yubai.svg" width="92" height="92" alt="">
      </div>
      <h1 class="launch-name">余白</h1>
      <div class="launch-wordmark" aria-hidden="true">YUBAI</div>
      <p class="launch-tagline">让每一笔都简单。</p>
      <div class="launch-status" role="status" aria-live="polite" aria-atomic="true">
        <span class="launch-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="loading-status">正在打开账本</span>
      </div>
      <button class="launch-retry" id="loading-retry" type="button" hidden>刷新重试</button>
      <noscript><p>需要启用浏览器的脚本功能。</p></noscript>
    </main>
    <footer class="launch-footer">
      <p>基于 Cashew · GPL-3.0</p>
      <nav aria-label="开源与许可">
        <a href="source/yubai-source.zip">查看源码</a>
        <a href="source/LICENSE.txt">开源许可</a>
      </nav>
    </footer>
  </div>
  <script>
    window.addEventListener('load', async function(ev) {
      // Retire this app's old Flutter worker without touching ledger storage.
      if ('serviceWorker' in navigator) {
        const scope = new URL('./', document.baseURI).href;
        const registrations = await navigator.serviceWorker.getRegistrations();
        let retired = false;
        for (const registration of registrations) {
          const script = registration.active && registration.active.scriptURL;
          if (registration.scope === scope && script &&
              new URL(script).pathname.endsWith('/flutter_service_worker.js')) {
            retired = (await registration.unregister()) || retired;
          }
        }
        if (retired && navigator.serviceWorker.controller) {
          location.reload();
          return;
        }
      }
      // A request can be refused by Safari; backups remain necessary.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => false);
      }
      const loading = document.querySelector('#loading');
      const status = document.querySelector('#loading-status');
      const retry = document.querySelector('#loading-retry');
      retry.addEventListener('click', () => location.reload());
      let dismissed = false;
      function revealApp() {
        if (dismissed) return;
        dismissed = true;
        loading.classList.add('is-ready');
        loading.setAttribute('aria-hidden', 'true');
        loading.addEventListener('transitionend', () => loading.remove(), {once: true});
        // CSS transitions may be disabled by the browser or accessibility settings.
        window.setTimeout(() => loading.remove(), 260);
      }
      window.addEventListener('flutter-first-frame', revealApp, {once: true});
      const pauseWhenHidden = () => document.documentElement.classList.toggle('launch-paused', document.hidden);
      document.addEventListener('visibilitychange', pauseWhenHidden);
      pauseWhenHidden();
      try {
        // Preserve this project's Flutter 3.22 loader and same-origin assets.
        const engine = await _flutter.loader.loadEntrypoint({});
        status.textContent = '正在准备界面';
        const runner = await engine.initializeEngine({useColorEmoji: true});
        document.querySelector('meta[name="viewport"]').content =
          'width=device-width, initial-scale=1, viewport-fit=cover';
        await runner.runApp();
        // Older renderer variants may not dispatch flutter-first-frame.
        requestAnimationFrame(() => requestAnimationFrame(revealApp));
      } catch (error) {
        loading.classList.add('is-error');
        status.textContent = '暂时未能打开账本';
        retry.hidden = false;
        console.error('Yubai startup failed', error);
      }
    });
  </script>
</body>
</html>
