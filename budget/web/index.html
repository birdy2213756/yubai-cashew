<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Local-only edition: block the unused Google sign-in SDK and external
       connections; assets and the public currency feed use this same host. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' blob: data:; font-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="余白">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFCF7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#191622">

  <title>余白 · Yubai</title>
  <link rel="manifest" href="manifest.json">

  <meta name="title" content="余白 · Yubai" />
  <meta name="description" content="Private local bookkeeping · Based on Cashew · GPL-3.0" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="余白 · Yubai" />
  <meta property="og:description" content="Private local bookkeeping · Based on Cashew · GPL-3.0" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="余白 · Yubai" />
  <meta property="twitter:description" content="Private local bookkeeping · Based on Cashew · GPL-3.0" />

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = {{flutter_service_worker_version}};
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body oncontextmenu="return false;">
  <style>
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #191622;
      }
    }
  </style>

  <script defer src="sql-wasm.js"></script>
  <div id="loading">
    <style>
      body {
        inset: 0;
        background-color: #FFFCF7;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      /* Let Safari provide the notch/home-indicator insets around the view. */
      @supports (padding: env(safe-area-inset-top)) {
        body {
          top: env(safe-area-inset-top);
          right: env(safe-area-inset-right);
          bottom: env(safe-area-inset-bottom);
          left: env(safe-area-inset-left);
        }
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #191622; }
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading .loading-spinner, #loading .loading-icon {
        transition: opacity 0.5s;
      }

      #loading.main_done .loading-spinner {
        opacity: 0;
      }

      #loading.init_done .loading-spinner, #loading.init_done .loading-icon {
        /* animation: .33s ease-in-out 0s 1 forwards zoom; */
        opacity: 0;
      }

      .loading-spinner {
        margin: 40px 10px;
        display: inline-block;
        width: 45px;
        height: 45px;
        border: 4px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: #e3e7ff;
        animation: spin 1s linear infinite;
        opacity: .66;
      }

      .column{
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .loading-icon{
        margin: 40px 10px;
        width: min(30vh, 30vw);
        height: min(30vh, 30vw);
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="column">
      <img src="./icons/Icon.png" class="loading-icon"/>
      <div class="loading-spinner"></div>
      <p><a href="source/yubai-source.zip">余白源码 / Source</a> ·
        <a href="source/LICENSE.txt">GPL-3.0 · Based on Cashew</a></p>
    </div>
  </div>
  <script>
    window.addEventListener('load', async function(ev) {
      // Retire this app's old Flutter worker without touching ledger storage.
      if ('serviceWorker' in navigator) {
        const scope = new URL('./', document.baseURI).href;
        const registrations = await navigator.serviceWorker.getRegistrations();
        let retired = false;
        for (const registration of registrations) {
          const script = registration.active && registration.active.scriptURL;
          if (registration.scope === scope && script &&
              new URL(script).pathname.endsWith('/flutter_service_worker.js')) {
            retired = (await registration.unregister()) || retired;
          }
        }
        if (retired && navigator.serviceWorker.controller) {
          location.reload();
          return;
        }
      }
      // A request can be refused by Safari; backups remain necessary.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => false);
      }
      var loading = document.querySelector('#loading');
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({}).then(function(engineInitializer) {
        loading.classList.add('main_done');
        return engineInitializer.initializeEngine({
          useColorEmoji: true,
        });
      }).then(function(appRunner) {
        document.querySelector('meta[name="viewport"]').content =
          'width=device-width, initial-scale=1, viewport-fit=cover';
        loading.classList.add('init_done');
        return appRunner.runApp();
      }).then(function (_) {
        // Wait a few milliseconds so users can see the "zoom" animation
        // before getting rid of the "loading" div.
        window.setTimeout(function () {
          loading.remove();
        }, 200);


      });
    });
  </script>
</body>
</html>
